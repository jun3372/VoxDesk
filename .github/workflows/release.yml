# 三平台打包并发布 GitHub Release（仅程序包，不含模型）
#
# 模型与程序已拆分：本流水线只打「应用 + 运行时」的程序包（约 100MB），
# 离线模型（约 1.4GB）由 .github/workflows/models.yml 单独打包，发布在
# models-v* 系列.Release；两个包配合使用的方式见发布说明。
#
# 除免安装压缩包外，每个平台由同一份构建产物再产出安装包：
#   Windows x64 — Inno Setup（windows-2022 runner 预装 ISCC）：
#                 voxdesk-windows-x64-v*-setup.exe（脚本 packaging/windows-installer.iss）
#   Linux       — .deb（debian:buster 容器内 dpkg-deb，UOS 20 / Debian 系原生格式，
#                 脚本 scripts/build_deb.sh）
#   macOS       — .dmg（hdiutil 生成，拖入「应用程序」即完成安装）
#
# 流水线骨架参照 sherpa-onnx 官方 Flutter 打包配置
# （.github/workflows/flutter-linux.yaml / flutter-macos.yaml / flutter-windows-x64.yaml，
#   https://github.com/k2-fsa/sherpa-onnx）：
#   - flutter-actions/setup-flutter 固定 SDK 版本 + cache
#   - 推送 v* 标签触发，workflow_dispatch 手动触发
#   - concurrency 并发组避免重复构建
#
# Linux 产物要求 glibc ≤ 2.28（兼容统信 UOS 20）：ubuntu-latest 的 glibc
# 是 2.39，直接构建的产物在 UOS 上无法运行，因此整个 job 在 debian:buster
# 容器（glibc 2.28）中执行，系统依赖清单与 docker/linux-builder.Dockerfile
# 保持一致，并额外用 objdump 校验产物的最高 GLIBC 符号版本。
#
# 用法：
#   发布：git tag v1.0.0 && git push origin v1.0.0（标签须与 pubspec.yaml 的
#         version 字段一致，不一致会构建失败）
#   试构建：Actions 页面手动 workflow_dispatch——只产出构建工件，不创建 Release。
#
# 注意：发布件不含模型，运行时首次使用需按发布说明放置模型包（或启动后在
#       应用内「加载模型」选择目录）；本地 make build 仍会把 ./models 内置。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 发布 Release 需要写权限

env:
  # 与 pubspec.yaml（sdk: ^3.13.3）及本地 .flutter 克隆一致的 stable 版本
  FLUTTER_VERSION: '3.47.4'

jobs:
  # ---------------- Linux（glibc 2.28：debian:buster 容器内构建，x64 + arm64） ----------------
  build-linux:
    name: Linux ${{ matrix.arch }} (glibc 2.28)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          # Flutter 不支持交叉编译，arm64 产物必须在 arm64 宿主上构建；
          # ubuntu-24.04-arm 为 GitHub 公共仓库免费 runner（私有仓库需付费
          # larger runner，或自建 arm64 机器注册同名 label，Gitea 同理）
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      # glibc 2.28，与 UOS 20 对齐；更高版本容器（如 ubuntu:24.04 / glibc 2.39）
      # 构建的产物无法在 UOS 20 上运行。官方镜像为多架构 manifest，按 runner
      # 架构自动拉取 amd64 / arm64 变体
      image: debian:buster

    steps:
      # buster 已 EOL：deb.debian.org 不再提供服务，换 archive.debian.org 归档源，
      # 并豁免 Release 文件过期检查（基础镜像尚无 ca-certificates，apt 走 http，
      # 完整性由 Release 文件的 GPG 签名保证）
      - name: 配置 apt 归档源并安装依赖（buster 已 EOL）
        run: |
          printf '%s\n' \
            'deb http://archive.debian.org/debian buster main' \
            'deb http://archive.debian.org/debian-security buster/updates main' \
            > /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          # 与 docker/linux-builder.Dockerfile 保持同一份系统依赖清单；
          # sudo 备用（GitHub Actions 里部分 action 内部会调 sudo）
          apt-get install -y --no-install-recommends \
            clang build-essential pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpulse-dev libasound2-dev \
            git curl ca-certificates unzip xz-utils zip python3-pip sudo
          git config --global --add safe.directory '*'

      - name: 安装新版 cmake / ninja（buster 自带 cmake 3.13 过旧）
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cmake ninja

      - uses: actions/checkout@v4

      # Flutter 官方不发布 linux-arm64 的 SDK tarball（release 只有 x64），
      # arm64 宿主改用 git 克隆安装：flutter 工具首次运行时自动下载与
      # 宿主架构匹配的 Dart SDK / 引擎产物（本地 .flutter 克隆即同一路径）
      - name: 安装 Flutter SDK（git 克隆，arm64 宿主无官方 tarball）
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - uses: flutter-actions/setup-flutter@v4
        if: matrix.arch == 'x64'
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter 版本信息
        run: |
          flutter --version
          flutter doctor

      - name: 构建并打包
        run: |
          flutter pub get
          # objective_c 的 hook 在 Linux 下无产物时不会创建该目录，但生成的
          # cmake_install.cmake 又无条件引用它，必须预建（同 Makefile）
          mkdir -p build/native_assets/linux
          flutter build linux --release

          BUNDLE=$(find build/linux -type d -path '*release/bundle' | head -1)
          [ -n "$BUNDLE" ] || { echo "✗ 未找到 Linux 构建产物"; exit 1; }

          # 换成 UOS 兼容启动器（默认软件渲染，不依赖 EGL）
          mv "$BUNDLE/voxdesk" "$BUNDLE/voxdesk.bin"
          cp docker/linux-launcher.sh "$BUNDLE/voxdesk"
          chmod +x "$BUNDLE/voxdesk"

          # 校验产物最高 GLIBC 符号依赖 ≤ 2.28（兼容 UOS 20 的红线）
          MAX=0
          for so in "$BUNDLE/voxdesk.bin" "$BUNDLE"/lib/*.so; do
            [ -e "$so" ] || continue
            M=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -uV | tail -1)
            echo "$(basename "$so"): 最高 GLIBC_${M:-none}"
            [ -n "$M" ] && MAX=$M
          done
          if [ "$(printf '%s\n' '2.28' "$MAX" | sort -V | tail -1)" != "2.28" ]; then
            echo "✗ 产物依赖 GLIBC_$MAX，超出 2.28 上限"; exit 1
          fi

          VER=$(sed -nE 's/^version:[[:space:]]*([0-9.]+).*/\1/p' pubspec.yaml | head -1)
          VER=${VER:-dev}
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VER" ]; then
            echo "✗ 标签 ${{ github.ref_name }} 与 pubspec.yaml 版本 v$VER 不一致，请修正后重新打标签"; exit 1
          fi

          # 容器内新构建的文件不带 macOS 扩展属性，无需 --no-xattrs
          mv "$BUNDLE" "$(dirname "$BUNDLE")/voxdesk"
          tar --exclude='._*' --exclude='.DS_Store' \
            -czf "build/voxdesk-linux-${{ matrix.arch }}-v$VER.tar.gz" -C "$(dirname "$BUNDLE")" voxdesk
          echo "✓ 已生成 build/voxdesk-linux-${{ matrix.arch }}-v$VER.tar.gz"
          du -sh "build/voxdesk-linux-${{ matrix.arch }}-v$VER.tar.gz"

          # 同一 bundle 再打 .deb 安装包（UOS 20 / Debian 系原生安装格式）
          bash scripts/build_deb.sh "$(dirname "$BUNDLE")/voxdesk" build

      - uses: actions/upload-artifact@v4
        with:
          name: voxdesk-linux-${{ matrix.arch }}
          path: build/voxdesk-linux-*
          retention-days: 5
          if-no-files-found: error

  # ---------------- macOS（Apple Silicon） ----------------
  build-macos:
    name: macOS arm64
    runs-on: macos-latest # arm64；Intel 版需 x86_64 runner（macos-13 已退役），从源码自建
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter 版本信息
        run: |
          flutter --version
          flutter doctor

      - name: 构建并打包
        run: |
          flutter pub get
          flutter build macos --release

          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "✗ 未找到 .app 产物"; exit 1; }

          VER=$(sed -nE 's/^version:[[:space:]]*([0-9.]+).*/\1/p' pubspec.yaml | head -1)
          VER=${VER:-dev}
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VER" ]; then
            echo "✗ 标签 ${{ github.ref_name }} 与 pubspec.yaml 版本 v$VER 不一致，请修正后重新打标签"; exit 1
          fi

          # 未做签名/公证；ditto 打 zip 保留可执行位
          ditto -c -k --keepParent "$APP" "build/voxdesk-macos-arm64-v$VER.zip"
          echo "✓ 已生成 build/voxdesk-macos-arm64-v$VER.zip"
          du -sh "build/voxdesk-macos-arm64-v$VER.zip"

          # DMG 安装镜像：拖入「应用程序」即完成安装（与 zip 同一产物，同样未签名）
          DMG_STAGE=$(mktemp -d)
          cp -R "$APP" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "离线语音工作台" -srcfolder "$DMG_STAGE" \
            -format UDZO -ov "build/voxdesk-macos-arm64-v$VER.dmg" > /dev/null
          rm -rf "$DMG_STAGE"
          echo "✓ 已生成 build/voxdesk-macos-arm64-v$VER.dmg"
          du -sh "build/voxdesk-macos-arm64-v$VER.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: voxdesk-macos-arm64
          path: build/voxdesk-macos-*
          retention-days: 5
          if-no-files-found: error

  # ---------------- Windows x64 ----------------
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: flutter 版本信息
        run: |
          flutter --version
          flutter doctor
        shell: bash

      - name: 构建并打包
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release

          RELEASE=build/windows/x64/runner/Release
          [ -d "$RELEASE" ] || { echo "✗ 未找到 Windows 构建产物"; exit 1; }

          VER=$(sed -nE 's/^version:[[:space:]]*([0-9.]+).*/\1/p' pubspec.yaml | head -1)
          VER=${VER:-dev}
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VER" ]; then
            echo "✗ 标签 ${{ github.ref_name }} 与 pubspec.yaml 版本 v$VER 不一致，请修正后重新打标签"; exit 1
          fi

          # bundle 目录改名，解压后得到 voxdesk/ 目录
          mv "$RELEASE" build/windows/voxdesk
          # 7z 预装在 windows runner 上；模型为不可压缩数据，-mx=1 换速度
          7z a -tzip -mx=1 "build/voxdesk-windows-x64-v$VER.zip" ./build/windows/voxdesk
          echo "✓ 已生成 build/voxdesk-windows-x64-v$VER.zip"
          du -sh "build/voxdesk-windows-x64-v$VER.zip"

          # 版本号带给后续 Inno Setup 步骤
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: 生成 Inno Setup 安装包
        shell: pwsh
        run: |
          # windows-2022 runner 预装 Inno Setup 6（自带简体中文向导语言文件）
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { Write-Error "未找到 ISCC.exe: $iscc"; exit 1 }
          & $iscc "/DAppVersion=$env:VER" "/DAppSource=$PWD\build\windows\voxdesk" packaging\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "build\voxdesk-windows-x64-v${env:VER}-setup.exe" | ForEach-Object { "✓ 已生成 $($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - uses: actions/upload-artifact@v4
        with:
          name: voxdesk-windows-x64
          path: build/voxdesk-windows-*
          retention-days: 5
          if-no-files-found: error

  # ---------------- 发布（仅 v* 标签触发） ----------------
  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # 三个平台的产物合并到 dist/ 平铺

      - name: 生成 SHA256 校验和
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: 生成发布说明
        run: |
          cat > release-notes.md <<'EOF'
          ## 下载说明（程序包不含模型）

          程序包与模型包**分开下载**：本 Release 只含程序（约 100MB）；
          离线模型（约 1.4GB）在 [`models-v*` Release](../../releases?q=models-v&expanded=false) 单独下载
          （`voxdesk-models-v*.tar.gz`，由 models 流水线自动打包）。

          每个平台同时提供**安装包**与**免安装压缩包**两种形态，内容一致，任选其一。

          | 平台 | 安装包 | 免安装压缩包 | 说明 |
          | --- | --- | --- | --- |
          | Windows x64 | `voxdesk-windows-x64-v*-setup.exe` | `voxdesk-windows-x64-v*.zip` | 安装包：中文向导、装到 `%LocalAppData%\Programs\VoxDesk`、带开始菜单 / 可选桌面快捷方式 |
          | Linux x64 | `voxdesk-linux-x64-v*.deb` | `voxdesk-linux-x64-v*.tar.gz` | **要求 glibc ≥ 2.28**，兼容统信 UOS 20 等旧系统 |
          | Linux arm64 | `voxdesk-linux-arm64-v*.deb` | `voxdesk-linux-arm64-v*.tar.gz` | 飞腾 / 鲲鹏等 arm64 主机（含 UOS arm64 版），同样要求 glibc ≥ 2.28 |
          | macOS Apple Silicon | `voxdesk-macos-arm64-v*.dmg` | `voxdesk-macos-arm64-v*.zip` | 未签名，首次打开需放行（见下） |

          ### 模型放置（三选一）

          先解压模型包得到 `models/` 目录，然后任选其一：

          1. **应用内选择（推荐）**：启动应用 → 左下角「加载模型」→ 选择该 `models/` 目录；
          2. **默认目录**：把 `models/` 里的全部内容放进系统「文档」目录下的 `VoxDesk/models/`，
             启动后自动加载；
          3. **合并成开箱即用版**：把 `models/` 内容放进程序目录的模型位置——
             - Windows：程序目录下 `data\models\`（安装包默认在 `%LocalAppData%\Programs\VoxDesk\data\models\`）；
             - Linux：`/opt/VoxDesk/data/models/`；
             - macOS：`离线语音工作台.app/Contents/Resources/models/`。

          ### Linux

          安装包方式（会自动装上依赖的运行库）：

          ```bash
          sudo apt install ./voxdesk-linux-x64-v*.deb   # 或 sudo dpkg -i 后按提示补依赖
          ```

          免安装方式：

          ```bash
          tar xzf voxdesk-linux-x64-v*.tar.gz
          cd voxdesk
          ./voxdesk
          ```

          - 基于 debian:buster 构建，最高仅依赖 GLIBC 2.28（UOS 20 / Debian 10 / CentOS 8 及以后均可运行）
          - 运行时依赖 GTK3 / GStreamer / PulseAudio / ALSA：
            `sudo apt install libgtk-3-0 gstreamer1.0-plugins-good gstreamer1.0-libav libpulse0 libasound2`
          - 默认软件渲染（适配云桌面 / 无 GPU 环境）；有可用 GPU 时可
            `FLUTTER_LINUX_RENDERER=opengl voxdesk` 切回硬件渲染

          ### macOS（Apple Silicon）

          打开 dmg 把应用拖入「应用程序」（或解压 zip）。未经签名公证，首次打开若提示
          「无法验证开发者」或「已损坏」：

          ```bash
          xattr -cr /Applications/离线语音工作台.app
          ```

          或在「系统设置 → 隐私与安全性」中点击「仍要打开」。

          ### Windows x64

          运行 `-setup.exe` 按向导安装，或解压 zip 后直接运行 `voxdesk\voxdesk.exe`。
          安装包与 exe 均未签名，若被 SmartScreen 拦截，点「更多信息 → 仍要运行」。
          EOF

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true # 追加自动生成的变更记录
